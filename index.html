<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>LA ZONA</title>
<meta name="theme-color" content="#060914">
<meta name="description" content="LA ZONA">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LA ZONA">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="in-setup">
<form class="setup" id="setupForm" autocomplete="off">
  <span class="brand">LA ZONA</span>
  <h1>Nueva partida</h1>
  <p class="setup-sub">Pon vuestros nombres y elige de qué va a ir el juego.</p>
  <fieldset>
    <legend>Jugadores</legend>
    <div class="names">
      <label class="field f0"><span>Jugador 1</span><input id="name0" type="text" maxlength="14" placeholder="Jugador 1" enterkeyhint="next"></label>
      <label class="field f1"><span>Jugador 2</span><input id="name1" type="text" maxlength="14" placeholder="Jugador 2" enterkeyhint="go"></label>
    </div>
  </fieldset>
  <fieldset>
    <legend>Categoría de la ruleta</legend>
    <div class="names">
      <label class="field f2"><span>Extremo izquierdo</span><input id="catL" type="text" maxlength="18" placeholder="Ej: Frío" required enterkeyhint="next"></label>
      <label class="field f2"><span>Extremo derecho</span><input id="catR" type="text" maxlength="18" placeholder="Ej: Caliente" required enterkeyhint="go"></label>
    </div>
    <p class="setup-note">Lo que escribas aquí es lo único que se mostrará en cada lado de la ruleta.</p>
  </fieldset>
  <button class="btn" type="submit">Empezar partida</button>
</form>
<header>
  <button class="back" id="back" type="button" aria-label="Volver al menú" title="Volver al menú"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button>
  <span class="brand">LA ZONA</span>
  <div class="players" id="players" aria-live="polite"></div>
</header>
<main>
  <p class="clue" id="clue"></p>
  <div class="stage">
    <svg id="dial" viewBox="-14 12 428 236" role="slider" aria-label="Dial: coloca la pista" aria-valuemin="0" aria-valuemax="100" tabindex="0"></svg>
  </div>
  <div class="result">
    <span class="lg lg-target" aria-hidden="true">Objetivo</span>
    <p class="verdict" id="verdict" aria-live="polite"></p>
    <span class="lg lg-guess" aria-hidden="true">Tu respuesta</span>
  </div>
  <button class="btn" id="action">Fijar respuesta</button>
  <p class="hint" id="hint"></p>
  <button class="settings" id="settings" type="button">⚙ Ajustes</button>
</main>
<script src="js/game.js"></script>
</body>
</html>
